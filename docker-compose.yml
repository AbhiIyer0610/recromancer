# Credentials are for loopback-only local use. The port is bound to 127.0.0.1.
name: recromancer
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: recromancer
      POSTGRES_PASSWORD: recromancer
      POSTGRES_DB: recromancer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - recromancer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recromancer -d recromancer"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  recromancer-pgdata:
